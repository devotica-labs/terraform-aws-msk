name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    permissions:
      contents: write # Required by upstream docs job even in verify-only mode.
      pull-requests: write
    uses: devotica-labs/terraform-shared-config/.github/workflows/terraform-module-ci.yml@26fb3202dc77a47e503c9149f402b144c8b54c12
    with:
      terraform-version: "1.11.4"
      run-conftest: false # Replaced below: upstream real plan requires AWS credentials.
      terraform-docs-auto-update: false
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
  policy:
    uses: ./.github/workflows/policy.yml
  all_green:
    if: always()
    needs: [shared, policy]
    runs-on: ubuntu-22.04
    steps:
      - name: Require all blocking gates
        env:
          SHARED: ${{ needs.shared.result }}
          POLICY: ${{ needs.policy.result }}
        run: test "$SHARED" = success && test "$POLICY" = success
